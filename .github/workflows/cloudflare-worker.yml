name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker.js'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          secrets: |
            AVALAI_API_KEY
            MYKET_PUBLIC_KEY
            IAP_RECEIPT_SECRET
        env:
          AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
          MYKET_PUBLIC_KEY: ${{ secrets.MYKET_PUBLIC_KEY }}
          IAP_RECEIPT_SECRET: ${{ secrets.IAP_RECEIPT_SECRET }}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    kotlinOptions {
        jvmTarget = '21'
    }
    namespace = "ir.ghadirb.familynutrition"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "ir.ghadirb.familynutrition"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode project.hasProperty('releaseVersionCode') ? (project.property('releaseVersionCode') as Integer) : 1
        versionName project.hasProperty('releaseVersionName') ? project.property('releaseVersionName') : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // پرداخت درون‌برنامه‌ای مایکت: کلید عمومی RSA برنامه از پنل توسعه‌دهندگان مایکت
        // (از env یا -PMYKET_PUBLIC_KEY خوانده می‌شود؛ در گیت ذخیره نمی‌شود).
        def marketApplicationId = "ir.mservices.market"
        def marketBindAddress = "ir.mservices.market.InAppBillingService.BIND"
        manifestPlaceholders = [marketApplicationId: "${marketApplicationId}",
                                marketBindAddress  : "${marketBindAddress}",
                                marketPermission   : "${marketApplicationId}.BILLING"]
        def myketKey = System.getenv("MYKET_PUBLIC_KEY") ?: (project.findProperty("MYKET_PUBLIC_KEY") ?: "")
        buildConfigField "String", "IAB_PUBLIC_KEY", "\"${myketKey}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def storeFilePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (storeFilePath != null && !storeFilePath.isEmpty()) {
                storeFile file(storeFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def storeFilePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (storeFilePath != null && !storeFilePath.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // پرداخت درون‌برنامه‌ای مایکت
    implementation 'com.github.myketstore:myket-billing-client:1.19'

    // پیاده‌سازی واقعی اتصال به Health Connect (فقط با رضایت کاربر و فقط
    // خواندن داده؛ نه نوشتن)
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinCoroutinesVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
